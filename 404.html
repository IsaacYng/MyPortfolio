<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Redirecting…</title>
<!-- GitHub Pages shows this file for any path that doesn't exist.
     It sends the visitor straight to the home page.
     A single word path like /kafin is treated as a poem link (/?poem=kafin);
     the home page opens that poem if it exists, otherwise it just shows home. -->
<script>
(function(){
  var seg=(location.pathname||'').replace(/^\/+|\/+$/g,'').replace(/^poems?\//,'').toLowerCase();
  location.replace(/^[a-z0-9-]+$/.test(seg) ? '/?poem='+seg : '/');
})();
</script>
<meta http-equiv="refresh" content="0; url=/"/>
<style>
  body{font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;background:#E4EAE9;color:#1C2A33;
       display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center}
  a{color:#B8233A;font-weight:700}
</style>
</head>
<body>
  <div>
    <p>Taking you home…</p>
    <p><a href="/">Continue</a></p>
  </div>
</body>
</html>
